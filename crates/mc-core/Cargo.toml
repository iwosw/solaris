[package]
name = "mc-core"
description = "Core model v2 (ADR 0013): data-parallel tick, columnar world state, tick journal (Solaris)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mc-data = { path = "../mc-data" }
mc-domain = { path = "../mc-domain" }
mc-world = { path = "../mc-world" }
mc-worldgen = { path = "../mc-worldgen" }
mc-physics = { path = "../mc-physics" }
mc-nbt = { path = "../mc-nbt" }
mc-script = { path = "../mc-script" }
mc-loader = { path = "../mc-loader" }
mc-plugin-host = { path = "../mc-plugin-host" }
uuid = { workspace = true, features = ["v4"] }
tokio.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
crc32fast.workspace = true
flate2.workspace = true
rayon.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
im = "15.1"
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "time"] }

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile = "3"
redb = "=3.1.0"
wit-component = "0.259"

[[bin]]
name = "core-bench"
path = "src/bin/core_bench.rs"
