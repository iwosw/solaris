# Gameplay math must use the Minecraft-like tables in mc_physics::mth, never host libm.
# Crate-scoped on purpose: mc-worldgen (geology math) and mc_physics::mth itself are unaffected.
disallowed-methods = [
    { path = "f64::sin", reason = "use mc_physics::mth tables" },
    { path = "f64::cos", reason = "use mc_physics::mth tables" },
    { path = "f64::sin_cos", reason = "use mc_physics::mth tables" },
    { path = "f64::atan2", reason = "use mc_physics::mth tables" },
    { path = "f64::hypot", reason = "use mc_physics::mth tables" },
    { path = "f32::sin", reason = "use mc_physics::mth tables" },
    { path = "f32::cos", reason = "use mc_physics::mth tables" },
    { path = "f32::sin_cos", reason = "use mc_physics::mth tables" },
    { path = "f32::atan2", reason = "use mc_physics::mth tables" },
    { path = "f32::hypot", reason = "use mc_physics::mth tables" },
]
