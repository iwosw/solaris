id = "ruby-live"
name = "Ruby Loader Live Gate"
version = "1.0.0"
api = "0.8.0"
events = ["player.joined", "player.left"]
player_commands = ["loader_ruby"]

[client]
schema = 2

[[client.bundles]]
id = "rich-content"
version = "1"
artifact = "client/rich-content.zip"
sha256 = "8132ecb7c7929dd7563536842f45991bdf29dfbb15c204b63cc82b4b42664d7c"
