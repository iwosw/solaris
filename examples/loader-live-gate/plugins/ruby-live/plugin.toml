loaders = ["fabric", "neoforge", "forge"]
content = ["blocks", "items", "views", "view_actions", "assets", "sounds"]
permissions = [
  "register_blocks",
  "register_items",
  "present_views",
  "send_view_actions",
  "load_assets",
  "play_sounds",
]
