name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SOLARIS_LOADER_REVISION: 060cf44b264a8404a6c8cf629c14867d6e5cd212
  SOLARIS_PLUGINS_REVISION: 2e6d6869d6f58c5fb5a377038cea1f7f69485fb8

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt
      - run: python3 -m tools.harness run fmt

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m tools.harness run clippy

  code-health:
    name: xtask code-health
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m tools.harness run code-health
  test:
    name: cargo test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SOLARIS_HARNESS_MEMORY_MAX: 8G
      # Short run; the full suite is the local L2 `run correctness` gate.
      SOLARIS_NEXTEST_PROFILE: ci
    defaults:
      run:
        working-directory: solaris
    steps:
      - uses: actions/checkout@v4
        with:
          path: solaris
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/solaris-default-plugins
          ref: ${{ env.SOLARIS_PLUGINS_REVISION }}
          path: solaris-default-plugins
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/solaris-loader
          ref: ${{ env.SOLARIS_LOADER_REVISION }}
          path: solaris-loader
      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: wasm32-unknown-unknown
      - run: rustup target add wasm32-unknown-unknown
        working-directory: solaris
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solaris -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract local vanilla test data (never redistributed)
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import urlopen

          version = "26.1.2"
          with urlopen("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json") as response:
              versions = json.load(response)["versions"]
          metadata_url = next(entry["url"] for entry in versions if entry["id"] == version)
          with urlopen(metadata_url) as response:
              server = json.load(response)["downloads"]["server"]
          with urlopen(server["url"]) as response:
              content = response.read()
          if hashlib.sha1(content).hexdigest() != server["sha1"]:
              raise SystemExit("Minecraft server checksum mismatch")
          destination = Path(".analysis/server.jar")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(content)
          print(f"Verified Minecraft {version} server: {server['sha1']}")
          PY
          tools/extract-vanilla-data.sh .analysis/server.jar
      - run: python3 -m tools.harness run test --workspace --all-targets --partition count:${{ matrix.shard }}/4
      - name: Retain failed test receipts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-receipts-${{ matrix.shard }}
          path: solaris/.analysis/validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 2

  wasm-host-arm:
    name: Wasmtime component host (Linux AArch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: wasm32-unknown-unknown
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mc-plugin-host --test host_bounds --test cleanup_isolation --test component_roundtrip --test contract_refusal --test host_baseline -- --show-output

  build:
    name: cargo build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m tools.harness run build --release

  loader:
    name: Loader modules
    runs-on: ubuntu-24.04
    env:
      SOLARIS_CLIENT_JAR: ${{ github.workspace }}/solaris-loader/.analysis/client.jar
      SOLARIS_HARNESS_MEMORY_MAX: 8G
    defaults:
      run:
        working-directory: solaris
    steps:
      - uses: actions/checkout@v4
        with:
          path: solaris
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/solaris-loader
          ref: ${{ env.SOLARIS_LOADER_REVISION }}
          path: solaris-loader
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Install fixture build dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify reproducible Loader fixture
        run: python3 -m tools.harness run fixture-check
      - name: Download verified Java compile input
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          properties = dict(
              line.split("=", 1)
              for line in Path("../solaris-loader/gradle.properties").read_text().splitlines()
              if "=" in line and not line.startswith("#")
          )
          version = properties["minecraftVersion"]
          with urlopen("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json") as response:
              versions = json.load(response)["versions"]
          metadata_url = next(entry["url"] for entry in versions if entry["id"] == version)
          with urlopen(metadata_url) as response:
              client = json.load(response)["downloads"]["client"]
          with urlopen(client["url"]) as response:
              content = response.read()
          if hashlib.sha1(content).hexdigest() != client["sha1"]:
              raise SystemExit("Minecraft client checksum mismatch")
          destination = Path(os.environ["SOLARIS_CLIENT_JAR"])
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(content)
          print(f"Verified Minecraft {version} client: {client['sha1']}")
          PY
      - name: Test shared and platform Loader modules
        run: python3 -m tools.harness run java
      - name: Retain failed Loader receipts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loader-failure-receipts
          path: solaris/.analysis/validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 2
      - name: Capture scope kill evidence
        if: failure()
        run: |
          sudo dmesg | grep -iE "oom|killed|out of memory" | tail -30 || true
          sudo journalctl -b --no-pager -n 300 | grep -iE "oom|killed|memory" | tail -40 || true

  release-tools:
    name: Release tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness lifecycle and engine syntax
        run: python3 -m tools.harness run harness-check
      - name: Validate installer
        run: python3 -m tools.harness run installer

  release-build:
    name: Release binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, code-health, test, build, loader, release-tools]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          test "$TAG" = "v${version}"
      - name: Build server binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p mc-edge --bin solaris-v2 --target "$TARGET"
      - name: Package release asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="solaris-${TARGET}.tar.gz"
          package_dir="dist/package-${TARGET}"
          mkdir -p "$package_dir"
          install -m 0755 "target/${TARGET}/release/solaris-v2" "$package_dir/solaris"
          install -m 0644 README.md example.toml LICENSE-APACHE LICENSE-MIT "$package_dir/"
          install -m 0644 "docs/releases/${GITHUB_REF_NAME}.md" "$package_dir/CHANGELOG.md"
          printf '%s\n' "$GITHUB_REF_NAME" > "$package_dir/VERSION"
          tar -C "$package_dir" -czf "dist/${asset}" \
            solaris README.md CHANGELOG.md example.toml LICENSE-APACHE LICENSE-MIT VERSION
          (
            cd dist
            sha256sum "$asset" > "${asset}.sha256"
          )
      - name: Smoke packaged CLI
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="dist/solaris-${TARGET}.tar.gz"
          smoke_dir="dist/smoke-${TARGET}"
          mkdir -p "$smoke_dir"
          tar -xzf "$archive" -C "$smoke_dir"
          test "$(cat "$smoke_dir/VERSION")" = "$TAG"
          "$smoke_dir/solaris" --help >/dev/null
          (
            cd "$smoke_dir"
            # Content startup requires the operator's licensed cache.
            ./solaris --config example.toml content verify --help >/dev/null
          )
      - uses: actions/upload-artifact@v4
        with:
          name: solaris-${{ matrix.target }}
          path: |
            dist/solaris-${{ matrix.target }}.tar.gz
            dist/solaris-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          # Consumed by the release job in the same run; release assets live on the GitHub release.
          retention-days: 1

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: solaris-*
          path: dist
          merge-multiple: true
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Solaris ${TAG}")
          # Every 0.x release is preliminary (draft maturity); keep it off `latest`.
          if [[ "$TAG" == *-* || "$TAG" == v0.* ]]; then
            release_args+=(--prerelease)
          fi
          notes_file="docs/releases/${TAG}.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" "${release_args[@]}"
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256
