[server]
name = "solaris-playable"
motd = "Solaris playable spike"
# Playable spike profile: keep the real-client join loop fast. This is not
# the view-distance-8 replacement-readiness profile.
view_distance = 4
simulation_distance = 4

[network]
# Local manual-gate listener. Change the TCP port here and connect to host:port;
# do not expose this offline profile to an untrusted network.
bind_address = "127.0.0.1"
port = 25565

[auth]
# Offline loopback profile for local real-client testing only.
online_mode = false

[plugins]
directory = "plugins"

[data]
# Native world for local play; preserve older worlds separately.
world_dir = ".analysis/test-world-v12"
vanilla_data_dir = "data/vanilla"
seed = 0

