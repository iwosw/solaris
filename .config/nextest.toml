[profile.default]
test-threads = "num-cpus"
fail-fast = false
retries = 0

[profile.default.junit]
path = "junit.xml"

# Four simultaneous component compilations fit the existing measured host
# budget; the rest of the workspace still uses all available CPUs.
[test-groups.component-host]
max-threads = 4

[[profile.default.overrides]]
filter = "package(mc-plugin-host)"
test-group = "component-host"
priority = 100

# CI short run: tests that took more than 3 s in the last local L2 run
# (.analysis/validation/20261018T113559-correctness-9qpwfhdd). The local
# `run correctness` gate keeps the full suite (profile default with
# --ignore-default-filter); CI selects this profile via SOLARIS_NEXTEST_PROFILE=ci.
