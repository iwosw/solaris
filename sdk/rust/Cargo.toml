[workspace]
resolver = "2"
members = [
    "solaris-plugin-sdk",
    "examples/hello",
    "examples/sky-creeper",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
solaris-plugin-sdk = { path = "solaris-plugin-sdk" }
wit-bindgen = "0.62"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
